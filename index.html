<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Custom Motor's</title>
  <!-- <script src="https://kit.fontawesome.com/8c1a452912.js" crossorigin="anonymous"></script> -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="./css/style.css">
            <style>
        .back-button {
            position: fixed;
            top: 10px;
            left: 10px;
            background-color: #333;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        .emoji {
            width: 20px;
            height: 20px;
            vertical-align: middle;
            margin-right: 8px;
        }

        .back-button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <button class="back-button" onclick="window.history.back()">
        <img src="https://i.postimg.cc/KYgdy2Nt/icons8-dashboard-32.png" alt="Retour" class="emoji">
        Retour
    </button>
    <div class="header">
        <div class="search-bar">
            <input type="text" id="matriculeInput" placeholder="Rechercher">
            <button class="CsearchButton" id="searchButton">Rechercher</button>
        </div>
        <!-- Ajout de la div pour la barre des noms -->
        <div class="name-bar" id="name-bar"></div>
    </div>
  <div id="result"></div>

  <!-- Inclusion du fichier JavaScript -->
  <script src="script.js"></script>
</body>
</html>
